<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ระบบบัญชีสมุดรายวันเฉพาะ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy header band, tab menu, slim stat strip, then one working surface per menu. Plain ledgers, no ornament. */
:root{
  --bg:#edf0f6; --surface:#ffffff; --surface2:#f4f6fa; --ink:#14213a; --ink2:#55637b; --line:#d6dde9;
  --navy:#13294b; --on-navy:#f2f5fb;
  --accent:#1f56c4; --accent-ink:#ffffff; --accent-soft:#e2eafa;
  --dr:#1f56c4; --cr:#0e7468; --cr-soft:#d8f0ec;
  --ok:#11785a; --ok-soft:#dcf2e9; --warn:#9a5204; --warn-soft:#fdecd2; --bad:#b3261e; --bad-soft:#fde6e3;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --c-pj:#8a5a14; --c-pj-s:#f6ecd9; --c-sj:#25549a; --c-sj-s:#e3ebf7; --c-cr:#2c7a5b; --c-cr-s:#e0f0e8; --c-cp:#a8403a; --c-cp-s:#f6e2df; --c-gj:#5b4b94; --c-gj-s:#e9e5f4; --jc-ink:#ffffff;
  --m1:#23467f; --m2:#23467f; --m3:#23467f; --m4:#23467f; --m5:#23467f; --m6:#23467f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121b2e; --surface2:#17223a; --ink:#e5ebf7; --ink2:#9eacc6; --line:#27344f;
    --navy:#0f1d3a; --on-navy:#f2f5fb;
    --accent:#6f9cff; --accent-ink:#0b1220; --accent-soft:#1a2a4e;
    --dr:#8db1ff; --cr:#5fd3c4; --cr-soft:#0f2e2b;
    --ok:#4cc9a0; --ok-soft:#0f2d27; --warn:#f0a94b; --warn-soft:#33260f; --bad:#ff8c82; --bad-soft:#3a1714;
    --c-pj:#e0b765; --c-pj-s:#33280f; --c-sj:#86aee8; --c-sj-s:#172a4a; --c-cr:#6cc3a0; --c-cr-s:#0f2e25; --c-cp:#ec9a92; --c-cp-s:#38201e; --c-gj:#b3a6e6; --c-gj-s:#272142; --jc-ink:#0b1220;
    --m1:#8db1ff; --m2:#8db1ff; --m3:#8db1ff; --m4:#8db1ff; --m5:#8db1ff; --m6:#8db1ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2e; --surface2:#17223a; --ink:#e5ebf7; --ink2:#9eacc6; --line:#27344f;
  --navy:#0f1d3a; --on-navy:#f2f5fb;
  --accent:#6f9cff; --accent-ink:#0b1220; --accent-soft:#1a2a4e;
  --dr:#8db1ff; --cr:#5fd3c4; --cr-soft:#0f2e2b;
  --ok:#4cc9a0; --ok-soft:#0f2d27; --warn:#f0a94b; --warn-soft:#33260f; --bad:#ff8c82; --bad-soft:#3a1714;
  --c-pj:#e0b765; --c-pj-s:#33280f; --c-sj:#86aee8; --c-sj-s:#172a4a; --c-cr:#6cc3a0; --c-cr-s:#0f2e25; --c-cp:#ec9a92; --c-cp-s:#38201e; --c-gj:#b3a6e6; --c-gj-s:#272142; --jc-ink:#0b1220;
  --m1:#8db1ff; --m2:#8db1ff; --m3:#8db1ff; --m4:#8db1ff; --m5:#8db1ff; --m6:#8db1ff;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
*{box-sizing:border-box}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
p{margin:0}
.muted{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}.c{text-align:center}

/* header */
.top{background:var(--navy);color:var(--on-navy)}
.top .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 320px}
.brand-ic{flex:none;width:48px;height:48px;display:grid;place-items:center}
.brand-ic svg{display:block;width:48px;height:48px}
.biz-input{width:100%;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.4);color:#fff;font:700 20px/1.3 var(--font);padding:2px 0;border-radius:0}
.biz-input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.brand small{display:block;opacity:.78;font-size:12.5px;margin-top:3px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1.3 var(--font);cursor:pointer;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.btn-mini:focus-visible,.btn-del:focus-visible,.menu button:focus-visible,.jt:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.sample{background:#fff;border-color:#fff;color:#13294b}
.btn.onnavy{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
.btn.onnavy:hover,.btn.sample:hover{border-color:#fff;filter:brightness(1.05)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-mini{flex:none;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:600 13px var(--font);cursor:pointer;white-space:nowrap}
.btn-del{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink2);font:500 13px var(--font);cursor:pointer;white-space:nowrap}
.btn-del:hover{color:var(--bad);border-color:var(--bad)}
.btn-del.armed{background:var(--bad);border-color:var(--bad);color:#fff}

/* chips + banners */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.neutral{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;border:1px solid;margin-bottom:16px}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alert.big{padding:22px 20px;font-size:18px;font-weight:700;border-width:2px;align-items:center}
.alert .ic{flex:none}
.confirm{background:var(--warn-soft);border-bottom:1px solid var(--warn);color:var(--warn)}
.confirm .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}

/* nav */
.navband{background:var(--surface);border-bottom:1px solid var(--line)}
.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.menu button{display:inline-flex;align-items:center;gap:8px;padding:13px 14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink2);font:500 14.5px var(--font);cursor:pointer;white-space:nowrap}
.menu button:hover{color:var(--ink)}
.menu button[aria-current="page"]{border-bottom-color:var(--mc);color:var(--mc);font-weight:700}
.menu .no{font-family:var(--mono);font-size:12px;min-width:20px;text-align:center;padding:0 5px;border-radius:5px;border:1px solid var(--mc);color:var(--mc)}

.main{padding-block:20px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:12.5px;color:var(--ink2)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px}
@media (max-width:640px){.stat{border-left:0;border-top:1px solid var(--line)}.stat:first-child{border-top:0}}

.page-h{margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--mc)}
.page-h h2{font-size:21px;color:var(--mc)}
.page-h p{color:var(--ink2);margin-top:3px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.card+.card,.card+.alert,.alert+.card{margin-top:16px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.card-h h3{font-size:16.5px}
.card-h .sub{font-size:13.5px;color:var(--ink2);margin-top:2px}
.card-b{padding:16px}

/* journal tabs */
.jtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.j-PJ{--jc:var(--c-pj);--jcs:var(--c-pj-s)}.j-SJ{--jc:var(--c-sj);--jcs:var(--c-sj-s)}.j-CR{--jc:var(--c-cr);--jcs:var(--c-cr-s)}.j-CP{--jc:var(--c-cp);--jcs:var(--c-cp-s)}.j-GJ{--jc:var(--c-gj);--jcs:var(--c-gj-s)}
.jt{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--font);cursor:pointer;white-space:nowrap}
.jt .sh{font-weight:700;font-size:12.5px;padding:1px 7px;border-radius:5px;background:var(--jcs);color:var(--jc)}
.jt .ct{font-size:12px;color:var(--ink2)}
.jt:hover{border-color:var(--jc)}
.jt[aria-selected="true"]{background:var(--jcs);border-color:var(--jc);color:var(--jc);font-weight:700}
.jt[aria-selected="true"] .sh{background:var(--jc);color:var(--jc-ink)}
.jt[aria-selected="true"] .ct{color:var(--jc)}
.jpage .btn.primary{background:var(--jc);border-color:var(--jc);color:var(--jc-ink)}
.card-h.tint{background:var(--jcs)}
.card-h.tint h3{color:var(--jc)}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--jcs);color:var(--ink);border:1px solid var(--jc);border-radius:8px;padding:10px 13px;margin-bottom:16px;font-size:14px}
.rule .ic{flex:none;color:var(--jc);margin-top:2px}

/* forms */
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 16px;align-items:start}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.hint{font-size:12.5px;color:var(--ink2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:400 16px var(--font);min-width:0}
.inp.m{text-align:right;font-variant-numeric:tabular-nums}
select.inp{padding-right:6px}
.party-row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipbtn{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:500 13px var(--font);cursor:pointer;text-align:left}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.party-add{margin-top:8px}
.prev{margin-top:16px;border:1px dashed var(--line);border-radius:8px;padding:12px 14px;background:var(--surface2)}
.prev-h{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.errs{margin:14px 0 0;padding:10px 14px 10px 30px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.flash{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-weight:600;font-size:14px}
.gj-row{display:grid;grid-template-columns:84px minmax(180px,1.2fr) minmax(180px,1.2fr) minmax(130px,.8fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:820px){.gj-row{grid-template-columns:84px 1fr;}.gj-row>*{grid-column:span 2}.gj-row>:first-child{grid-column:span 1}}
.gj-tot{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px;font-weight:600}

/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:620px}
.tbl.wide{min-width:900px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink2);padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.r{text-align:right}.tbl th.c{text-align:center}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--ink2);border-bottom:0;background:var(--surface2)}
.tbl .vl{border-left:2px solid var(--ink2)}
.tbl td.r{text-align:right}
.code{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.doc{font-family:var(--mono);font-size:13px}
.desc b{font-weight:600}
.desc .why{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;max-width:46ch}
.jb{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:5px;background:var(--jcs);color:var(--jc);border:1px solid var(--jc);white-space:nowrap}
.tag{display:inline-block;min-width:28px;text-align:center;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:5px}
.tag.dr{background:var(--accent-soft);color:var(--dr)}
.tag.cr{background:var(--cr-soft);color:var(--cr)}
.lines{min-width:240px}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:1px 0;font-size:14px}
.ln.cr{padding-left:16px}
.ln .nm{min-width:0}
.party{color:var(--ink2);font-size:13px}
.empty{padding:30px 18px;text-align:center;color:var(--ink2)}
.empty b{color:var(--ink)}

/* ledgers, recon */
.recon{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.rc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px}
.rc h3{font-size:15.5px;margin-bottom:8px}
.rc .rw{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14.5px}
.rc .rw.d{border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.rc.ok{border-color:var(--ok)}
.rc.bad{border-color:var(--bad)}
.gl-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;border:0;background:transparent;color:var(--ink);font:500 14px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.add-name{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.add-name .inp{max-width:320px}
.filter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.flt-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.flt-f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
.flt-f .inp{width:auto;min-width:165px}
.flt-q{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:1px}
.flt-row>.chip{margin-bottom:6px}
.btn-mini[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{padding-block:8px 36px;font-size:13px;color:var(--ink2)}
.hide-sm{display:inline}
@media (max-width:560px){.hide-sm{display:none}.biz-input{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.alert,.flash{animation:fadein .25s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}}
</style>

function derive(data, range) {
  var from = (range && range.from) || '', to = (range && range.to) || '';

    .sort(function (a, b) { return a.t.date === b.t.date ? a.i - b.i : (a.t.date < b.t.date ? -1 : 1); })
    .map(function (x) { return Object.assign({}, x.t); });
  var cnt = {};
  sorted.forEach(function (t) {
    cnt[t.journal] = (cnt[t.journal] || 0) + 1;
    t.seq = cnt[t.journal];
    t.ref = J[t.journal].short + '.' + Math.ceil(t.seq / PAGE);
    t.totalDr = t.lines.reduce(function (s, l) { return s + l.dr; }, 0);
    t.totalCr = t.lines.reduce(function (s, l) { return s + l.cr; }, 0);
    t.balanced = t.totalDr === t.totalCr;
    t.inRange = (!from || t.date >= from) && (!to || t.date <= to);
    t.upto = !to || t.date <= to;
  });
  var accMap = {};
  data.accounts.forEach(function (a) { accMap[a.code] = a; });
  var ledAll = {};
  sorted.forEach(function (t) {
    if (!t.upto) return;
    t.lines.forEach(function (l) {
      if (!l.dr && !l.cr) return;
      (ledAll[l.acct] = ledAll[l.acct] || []).push({ date: t.date, desc: t.desc, ref: t.ref, doc: t.doc, dr: l.dr, cr: l.cr, party: l.party || '' });
    });
  });
  /* led = รายการในช่วงที่เลือก, open = ยอดยกมาก่อนช่วง, bal = ยอดคงเหลือ ณ วันสิ้นสุดช่วง */
  var led = {}, open = {}, bal = {};
  Object.keys(ledAll).forEach(function (k) {
    var r = 0, o = 0, shown = [];
    ledAll[k].forEach(function (e) {
      if (from && e.date < from) { o += e.dr - e.cr; r = o; }
      else { r += e.dr - e.cr; shown.push(Object.assign({}, e, { bal: r })); }
    });
    led[k] = shown; open[k] = o; bal[k] = r;
  });

  function sub(acct, list, sign) {
    var names = list.slice(), map = {}, unassigned = 0;
    names.forEach(function (n) { map[n] = { open: 0, run: 0, ents: [] }; });
    (ledAll[acct] || []).forEach(function (e) {
      if (!e.party) { unassigned += sign * (e.dr - e.cr); return; }
      if (!map[e.party]) { map[e.party] = { open: 0, run: 0, ents: [] }; names.push(e.party); }
      var m = map[e.party], v = sign * (e.dr - e.cr);
      if (from && e.date < from) { m.open += v; m.run = m.open; }
      else { m.run += v; m.ents.push(Object.assign({}, e, { bal: m.run })); }
    });
    var rows = names.map(function (n) { return { name: n, open: map[n].open, ents: map[n].ents, balance: map[n].run }; });
    return { rows: rows, total: rows.reduce(function (s, x) { return s + x.balance; }, 0), unassigned: unassigned };
  }
  var ar = sub('111', data.ars, 1), ap = sub('201', data.aps, -1);

  var tbRows = data.accounts.filter(function (a) { return ledAll[a.code]; }).map(function (a) {
    var b = bal[a.code];
    return { code: a.code, name: a.name, dr: b > 0 ? b : 0, cr: b < 0 ? -b : 0 };
  });
  Object.keys(ledAll).forEach(function (k) { if (!accMap[k]) tbRows.push({ code: k, name: '(ไม่พบชื่อบัญชี)', dr: bal[k] > 0 ? bal[k] : 0, cr: bal[k] < 0 ? -bal[k] : 0 }); });
  tbRows.sort(function (a, b) { return codeCmp(a.code, b.code); });
  var sumDr = tbRows.reduce(function (s, r) { return s + r.dr; }, 0);
  var sumCr = tbRows.reduce(function (s, r) { return s + r.cr; }, 0);
  var last = to || (sorted.length ? sorted[sorted.length - 1].date : '');
  return {
    sorted: sorted, accMap: accMap, ledAll: ledAll, led: led, open: open, bal: bal, ar: ar, ap: ap,
    inCount: sorted.filter(function (t) { return t.inRange; }).length,
    tb: { rows: tbRows, sumDr: sumDr, sumCr: sumCr, diff: Math.abs(sumDr - sumCr), ok: sumDr === sumCr, has: sorted.length > 0, last: last },
    bad: sorted.filter(function (t) { return t.upto && !t.balanced; })
  };
}

function GJForm(c) {
  var b = useBase('GJ', c.data.txns), acc = c.data.accounts;
  function blank(side) { return { id: uid(), side: side, acct: '', party: '', amt: '' }; }
  var s1 = useState(function () { return [blank('Dr'), blank('Cr')]; }), rows = s1[0], setRows = s1[1];
  function upd(id, patch) { setRows(function (rs) { return rs.map(function (r) { return r.id === id ? Object.assign({}, r, patch) : r; }); }); }
  var sumDr = 0, sumCr = 0;
  rows.forEach(function (r) { var v = toSat(r.amt); if (r.side === 'Dr') sumDr += v; else sumCr += v; });
  var any = sumDr + sumCr > 0, balanced = sumDr === sumCr, diff = Math.abs(sumDr - sumCr);
  function save(force) {
    var er = []; b.check(er);
    var lines = [], hasDr = false, hasCr = false;
    rows.forEach(function (r, i) {
      var v = toSat(r.amt);
      if (!r.acct && v === 0) return;
      if (!r.acct) { er.push('แถวที่ ' + (i + 1) + ': กรุณาเลือกบัญชี'); return; }
      if (r.acct === '101' || r.acct === '102') { er.push('แถวที่ ' + (i + 1) + ': รายการเงินสด/เงินฝากธนาคารต้องบันทึกในสมุดรายวันรับเงินหรือจ่ายเงิน'); return; }
      if (v <= 0) { er.push('แถวที่ ' + (i + 1) + ': กรุณาระบุจำนวนเงินมากกว่า 0'); return; }
      var pk = partyKind(r.acct);
      if (pk && !r.party) { er.push('แถวที่ ' + (i + 1) + ': บัญชี ' + r.acct + ' ต้องเลือกชื่อ' + partyLabel(pk) + 'รายตัว'); return; }
      if (r.side === 'Dr') { hasDr = true; lines.push(ln(r.acct, v, 0, pk ? r.party : '')); } else { hasCr = true; lines.push(ln(r.acct, 0, v, pk ? r.party : '')); }
    });
    if (!er.length && (!hasDr || !hasCr)) er.push('ต้องมีอย่างน้อย 1 แถวเดบิตและ 1 แถวเครดิต');
    if (er.length) { b.setErrs(er); return; }
    c.addTxn(b.make(lines, 'รายการสมุดรายวันทั่วไป'));
    setRows([blank('Dr'), blank('Cr')]); b.done();
  }
  function fillTest() {
    var ap = c.data.aps[0] || '';
    setRows([{ id: uid(), side: 'Dr', acct: '131', party: '', amt: '50,000.00' }, { id: uid(), side: 'Cr', acct: '201', party: ap, amt: '45,000.00' }]);
    b.setDesc('ทดสอบระบบ: ซื้ออุปกรณ์สำนักงานเป็นเงินเชื่อ (ตั้งใจให้เดบิต ≠ เครดิต)'); b.setDoc('JV-TEST'); b.setErrs([]);
  }
  return html`<form onSubmit=${function (e) { e.preventDefault(); save(false); }} noValidate>
    <div className="grid-f"><${DateDoc} b=${b} /><${DescReason} b=${b} auto="รายการสมุดรายวันทั่วไป" /></div>
    <div style=${{ marginTop: 14 }}>
      <div className="lbl" style=${{ marginBottom: 2 }}>แถวรายการเดบิต / เครดิต</div>
      ${rows.map(function (r, i) {
    var pk = partyKind(r.acct);
    return html`<div key=${r.id} className="gj-row">
          <select className="inp" aria-label=${'ด้านของแถวที่ ' + (i + 1)} value=${r.side} onChange=${function (e) { upd(r.id, { side: e.target.value }); }}><option value="Dr">Dr</option><option value="Cr">Cr</option></select>
          <${AccSelect} accounts=${acc} value=${r.acct} placeholder="— เลือกบัญชี —" exclude=${['101', '102']} onChange=${function (v) { upd(r.id, { acct: v, party: '' }); }} />
          <div>${pk ? html`<${PartyPicker} kind=${pk} list=${pk === 'AR' ? c.data.ars : c.data.aps} value=${r.party} onChange=${function (v) { upd(r.id, { party: v }); }} onAddParty=${c.addParty} />` : html`<span className="hint">${r.acct ? 'บัญชีนี้ไม่ต้องระบุชื่อรายตัว' : 'เลือกบัญชี 111 หรือ 201 แล้วจะมีช่องกรอกชื่อลูกหนี้/เจ้าหนี้'}</span>`}</div>
          <${MoneyInput} value=${r.amt} onChange=${function (v) { upd(r.id, { amt: v }); }} />
          <button type="button" className="btn-del" aria-label="ลบแถว" disabled=${rows.length <= 2} onClick=${function () { setRows(rows.filter(function (x) { return x.id !== r.id; })); }}><${Icon} n="Trash2" size=${14} /></button>
        </div>`;
  })}
      <div className="actions" style=${{ marginTop: 10 }}>
        <button type="button" className="btn" onClick=${function () { setRows(rows.concat([blank('Dr')])); }}><${Icon} n="Plus" size=${15} />เพิ่มแถว Dr</button>
        <button type="button" className="btn" onClick=${function () { setRows(rows.concat([blank('Cr')])); }}><${Icon} n="Plus" size=${15} />เพิ่มแถว Cr</button>
      </div>
      <div className="gj-tot"><span>รวมเดบิต: <span className="num">${fmt(sumDr)}</span></span><span>รวมเครดิต: <span className="num">${fmt(sumCr)}</span></span></div>
    </div>
    ${any && !balanced ? html`<div className="alert warn" role="alert" style=${{ marginTop: 14, marginBottom: 0 }}><${Icon} n="AlertTriangle" size=${20} className="ic" />
      <div><b>ยอดเดบิตไม่เท่ากับเครดิต</b> (ผลต่าง ${fmt(diff)} บาท)<div style=${{ fontSize: 13.5, marginTop: 2 }}>บันทึกต่อได้เฉพาะเพื่อทดสอบระบบ รายการนี้จะทำให้งบทดลองไม่สมดุล</div></div></div>` : null}
    ${any && balanced ? html`<div className="alert ok" style=${{ marginTop: 14, marginBottom: 0 }}><${Icon} n="CheckCircle2" size=${20} className="ic" /><div>เดบิตเท่ากับเครดิต พร้อมบันทึก</div></div>` : null}
    <${Errs} errs=${b.errs} />
    <div className="actions">
      ${any && !balanced
      ? html`<button type="button" className="btn warn" onClick=${function () { save(true); }}><${Icon} n="AlertTriangle" size=${16} />ยืนยันบันทึกเพื่อทดสอบระบบ (Force Save)</button>`
      : html`<button type="submit" className="btn primary"><${Icon} n="Plus" size=${16} />บันทึกรายการ</button>`}
      <button type="button" className="btn" onClick=${fillTest}><${Icon} n="FlaskConical" size=${16} />เพิ่มรายการทดสอบผิดพลาด (Dr ≠ Cr)</button>
      ${b.flash ? html`<span className="flash"><${Icon} n="CheckCircle2" size=${16} />บันทึกรายการเรียบร้อย</span>` : null}
    </div>
    <p className="hint" style=${{ marginTop: 10 }}>คำแนะนำ: กด “เพิ่มรายการทดสอบผิดพลาด” แล้วกด “ยืนยันบันทึกเพื่อทดสอบระบบ” จากนั้นไปเมนู 5 งบทดลอง เพื่อดูคำเตือนงบไม่สมดุล</p>
  </form>`;
}

/* ───────── เมนู 3: บัญชีแยกประเภททั่วไป ───────── */
function sideTag(v) { return v === 0 ? null : html`<span className=${'tag ' + (v > 0 ? 'dr' : 'cr')}>${v > 0 ? 'Dr' : 'Cr'}</span>`; }

function LedgerTable(p) {
  var sd = p.entries.reduce(function (s, e) { return s + e.dr; }, 0), sc = p.entries.reduce(function (s, e) { return s + e.cr; }, 0);
  var net = p.open + sd - sc;
  return html`<div className="tw"><table className="tbl">
    <thead><tr><th>วันที่</th><th>รายการ</th><th>อ้างอิง</th><th className="r">เดบิต</th><th className="r">เครดิต</th><th className="r">ยอดคงเหลือ</th><th></th></tr></thead>
    <tbody>${p.open !== 0 ? html`<tr><td className="num">${fmtDate(p.from)}</td><td><b>ยอดยกมา</b></td><td></td><td></td><td></td><td className="r num">${fmt(Math.abs(p.open))}</td><td>${sideTag(p.open)}</td></tr>` : null}
    ${p.entries.map(function (e, i) {
    return html`<tr key=${i}><td className="num">${fmtDate(e.date)}</td><td>${e.desc}${e.party ? html` <span className="party">(${e.party})</span>` : null}</td><td><span className="code">${e.ref}</span></td>
        <td className="r num">${e.dr ? fmt(e.dr) : ''}</td><td className="r num">${e.cr ? fmt(e.cr) : ''}</td><td className="r num">${fmt(Math.abs(e.bal))}</td><td>${sideTag(e.bal)}</td></tr>`;
  })}</tbody>
    <tfoot><tr><td colSpan=${3}>${p.open !== 0 ? 'รวมในช่วงนี้ / ยอดคงเหลือ' : 'รวม'}</td><td className="r num">${fmt(sd)}</td><td className="r num">${fmt(sc)}</td><td className="r num">${fmt(Math.abs(net))}</td><td>${sideTag(net)}</td></tr></tfoot></table></div>`;
}

function TAccount(p) {
  var drs = p.entries.filter(function (e) { return e.dr > 0; }), crs = p.entries.filter(function (e) { return e.cr > 0; });
  if (p.open > 0) drs.unshift({ date: p.from, desc: 'ยอดยกมา', ref: '', dr: p.open });
  if (p.open < 0) crs.unshift({ date: p.from, desc: 'ยอดยกมา', ref: '', cr: -p.open });
  var sd = drs.reduce(function (s, e) { return s + e.dr; }, 0), sc = crs.reduce(function (s, e) { return s + e.cr; }, 0), net = sd - sc;
  var n = Math.max(drs.length, crs.length), idx = [];
  for (var i = 0; i < n; i++) idx.push(i);
  var lab = function (e) { return e.ref ? e.desc + ' (' + e.ref + ')' : e.desc; };
  return html`<div className="tw"><table className="tbl" style=${{ minWidth: 760 }}>
    <thead><tr><th colSpan=${3} className="c">เดบิต (Dr)</th><th colSpan=${3} className="c vl">เครดิต (Cr)</th></tr>
      <tr><th>วันที่</th><th>รายการ (อ้างอิง)</th><th className="r">จำนวนเงิน</th><th className="vl">วันที่</th><th>รายการ (อ้างอิง)</th><th className="r">จำนวนเงิน</th></tr></thead>
    <tbody>${idx.map(function (i) {
    var a = drs[i], b = crs[i];
    return html`<tr key=${i}>
        <td className="num">${a ? fmtDate(a.date) : ''}</td><td>${a ? lab(a) : ''}</td><td className="r num">${a ? fmt(a.dr) : ''}</td>
        <td className="vl num">${b ? fmtDate(b.date) : ''}</td><td>${b ? lab(b) : ''}</td><td className="r num">${b ? fmt(b.cr) : ''}</td></tr>`;
  })}</tbody>
    <tfoot><tr><td colSpan=${2}>รวมเดบิต</td><td className="r num">${fmt(sd)}</td><td className="vl" colSpan=${2}>รวมเครดิต</td><td className="r num">${fmt(sc)}</td></tr>
      <tr><td colSpan=${3}>${net > 0 ? 'ยอดคงเหลือ (เดบิต) ' + fmt(net) : ''}</td><td className="vl" colSpan=${3}>${net < 0 ? 'ยอดคงเหลือ (เครดิต) ' + fmt(-net) : (net === 0 ? 'ยอดคงเหลือ 0.00' : '')}</td></tr></tfoot></table></div>`;
}

function EmptyHint() {
  return html`<div className="card"><div className="empty"><b>ยังไม่มีรายการค้าในระบบ</b><br />กดปุ่ม “กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า” ที่แถบด้านบน หรือบันทึกรายการเองที่เมนู 1</div></div>`;

    var b = c.d.bal[k];
    return html`<div className="card" key=${k}><div className="card-h"><h3><span className="code" style=${{ fontSize: 15 }}>${k}</span> ${c.d.accMap[k] ? c.d.accMap[k].name : ''}</h3>
          <span className="chip neutralchip" style=${{ background: 'var(--surface2)', border: '1px solid var(--line)' }}>ยอดคงเหลือ <span className="num">${fmt(Math.abs(b))}</span> ${sideTag(b)}</span></div>
          ${view === 'table' ? html`<${LedgerTable} entries=${c.d.led[k]} open=${c.d.open[k]} from=${c.range.from} />` : html`<${TAccount} entries=${c.d.led[k]} open=${c.d.open[k]} from=${c.range.from} />`}</div>`;
  })}<//>`}
  </section>`;
}

/* ───────── เมนู 4: บัญชีแยกประเภทย่อย + กระทบยอด ───────── */
function AddName(p) {
  var s = useState(''), v = s[0], setV = s[1];
  function add() { var n = v.trim(); if (!n) return; p.onAdd(p.kind, n); setV(''); }
  return html`<div className="add-name"><input className="inp" placeholder=${'เพิ่มชื่อ' + partyLabel(p.kind) + 'ใหม่'} aria-label=${'ชื่อ' + partyLabel(p.kind) + 'ใหม่'} value=${v} onChange=${function (e) { setV(e.target.value); }} onKeyDown=${function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } }} />
    <button type="button" className="btn-mini" onClick=${add}>+ เพิ่มรายชื่อ</button></div>`;
}

function SubSection(p) {
  var isAR = p.kind === 'AR', s = isAR ? p.d.ar : p.d.ap;
  var title = isAR ? 'บัญชีแยกประเภทย่อย: ลูกหนี้การค้า' : 'บัญชีแยกประเภทย่อย: เจ้าหนี้การค้า';
  return html`<div className="card"><div className="card-h"><div><h3>${title}</h3><div className="sub">ยอดคงเหลือฝั่ง${isAR ? 'เดบิต' : 'เครดิต'} · ควบคุมโดยบัญชี ${isAR ? '111' : '201'}</div></div></div>
    <${AddName} kind=${p.kind} onAdd=${p.addParty} />
    <div className="tw"><table className="tbl" style=${{ minWidth: 420 }}><thead><tr><th>${isAR ? 'ลูกหนี้' : 'เจ้าหนี้'}</th><th className="r">ยอดคงเหลือ</th></tr></thead>
      <tbody>${s.rows.map(function (r) { return html`<tr key=${r.name}><td>${r.name}</td><td className="r num">${fmt(r.balance)}</td></tr>`; })}</tbody>
      <tfoot><tr><td>รวมยอดรายตัว</td><td className="r num">${fmt(s.total)}</td></tr></tfoot></table></div>
    ${s.rows.filter(function (r) { return r.ents.length || r.open !== 0; }).map(function (r) {
    return html`<div key=${r.name} style=${{ borderTop: '1px solid var(--line)' }}><div style=${{ padding: '12px 16px 4px', fontWeight: 600 }}>${r.name}</div>
        <div className="tw"><table className="tbl"><thead><tr><th>วันที่</th><th>รายการ</th><th>อ้างอิง</th><th className="r">เดบิต</th><th className="r">เครดิต</th><th className="r">ยอดคงเหลือ</th></tr></thead>
          <tbody>${r.open !== 0 ? html`<tr><td className="num">${fmtDate(p.range.from)}</td><td><b>ยอดยกมา</b></td><td></td><td></td><td></td><td className="r num">${fmt(r.open)}</td></tr>` : null}${r.ents.map(function (e, i) { return html`<tr key=${i}><td className="num">${fmtDate(e.date)}</td><td>${e.desc}</td><td><span className="code">${e.ref}</span></td><td className="r num">${e.dr ? fmt(e.dr) : ''}</td><td className="r num">${e.cr ? fmt(e.cr) : ''}</td><td className="r num">${fmt(e.bal)}</td></tr>`; })}</tbody>
          <tfoot><tr><td colSpan=${5}>ยอดคงเหลือ</td><td className="r num">${fmt(r.balance)}</td></tr></tfoot></table></div></div>`;
  })}</div>`;
}

function ReconBox(p) {
  var diff = p.control - p.sub, ok = diff === 0;
  return html`<div className=${'rc ' + (ok ? 'ok' : 'bad')}><h3>${p.title}</h3>
    <div className="rw"><span>${p.subLabel}</span><span className="num">${fmt(p.sub)}</span></div>
    <div className="rw"><span>${p.ctlLabel}</span><span className="num">${fmt(p.control)}</span></div>
    <div className="rw d"><span>ผลต่าง</span><span className="num">${fmt(diff)}</span></div>
    <div style=${{ marginTop: 8 }}>${ok ? html`<span className="chip ok"><${Icon} n="CheckCircle2" size=${15} />ตรงกัน</span>` : html`<span className="chip bad"><${Icon} n="AlertTriangle" size=${15} />ไม่ตรงกัน</span>`}</div></div>`;
}

function SubPage(c) {
  var glAR = c.d.bal['111'] || 0, glAP = -(c.d.bal['201'] || 0);
  return html`<section style=${{ '--mc': 'var(--m4)' }}>
    <div className="page-h"><h2>เมนู 4 · บัญชีแยกประเภทย่อย และการกระทบยอด</h2><p>บัญชีลูกหนี้และเจ้าหนี้แยกรายตัว เปรียบเทียบกับบัญชีคุมในบัญชีแยกประเภททั่วไป</p></div>
    <div className="recon">
      <${ReconBox} title="กระทบยอดลูกหนี้การค้า" subLabel="ยอดรวมลูกหนี้รายตัว" ctlLabel="ยอดคงเหลือบัญชีคุม 111 ลูกหนี้การค้า" sub=${c.d.ar.total} control=${glAR} />
      <${ReconBox} title="กระทบยอดเจ้าหนี้การค้า" subLabel="ยอดรวมเจ้าหนี้รายตัว" ctlLabel="ยอดคงเหลือบัญชีคุม 201 เจ้าหนี้การค้า" sub=${c.d.ap.total} control=${glAP} />
    </div>
    <${SubSection} kind="AR" d=${c.d} range=${c.range} addParty=${c.addParty} />
    <${SubSection} kind="AP" d=${c.d} range=${c.range} addParty=${c.addParty} />
  </section>`;
}

/* ───────── เมนู 5: งบทดลอง ───────── */
function TBPage(c) {
  var tb = c.d.tb;
  return html`<section style=${{ '--mc': 'var(--m5)' }}>
    <div className="page-h"><h2>เมนู 5 · งบทดลอง (Trial Balance)</h2><p>${c.data.biz} ${tb.last ? 'ณ วันที่ ' + fmtDate(tb.last) : ''} · ดึงยอดคงเหลือจากบัญชีแยกประเภททั่วไปอัตโนมัติ${c.range.from ? ' (ยอดสะสมตั้งแต่ต้นจนถึงวันสิ้นสุดช่วง)' : ''}</p></div>
    ${!tb.has ? html`<${EmptyHint} />` : html`<${Frag}>
      ${tb.ok ? html`<div className="alert ok"><${Icon} n="CheckCircle2" size=${22} className="ic" /><div style=${{ fontWeight: 700, fontSize: 17 }}>งบทดลองสมดุล (Balanced)</div></div>`
      : html`<div className="alert bad big" role="alert"><${Icon} n="AlertTriangle" size=${34} className="ic" /><div>คำเตือน: งบทดลองไม่สมดุล! ยอดรวมเดบิตไม่เท่ากับยอดรวมเครดิต (ผลต่าง ${fmt(tb.diff)} บาท)</div></div>`}
      ${c.d.bad.length ? html`<div className="alert warn"><${Icon} n="AlertTriangle" size=${20} className="ic" /><div><b>รายการที่เดบิต ≠ เครดิต (${c.d.bad.length})</b><ul style=${{ margin: '4px 0 0', paddingLeft: 18 }}>${c.d.bad.map(function (t) { return html`<li key=${t.id}>${fmtDate(t.date)} · ${t.doc} · ${J[t.journal].name}: เดบิต ${fmt(t.totalDr)} / เครดิต ${fmt(t.totalCr)}</li>`; })}</ul></div></div>` : null}
      <div className="card"><div className="tw"><table className="tbl" style=${{ minWidth: 520 }}>
        <thead><tr><th>เลขที่บัญชี</th><th>ชื่อบัญชี</th><th className="r">เดบิต</th><th className="r">เครดิต</th></tr></thead>
        <tbody>${tb.rows.map(function (r) { return html`<tr key=${r.code}><td><span className="code">${r.code}</span></td><td>${r.name}</td><td className="r num">${r.dr ? fmt(r.dr) : ''}</td><td className="r num">${r.cr ? fmt(r.cr) : ''}</td></tr>`; })}</tbody>
        <tfoot><tr><td colSpan=${2}>รวม</td><td className="r num">${fmt(tb.sumDr)}</td><td className="r num">${fmt(tb.sumCr)}</td></tr></tfoot></table></div></div>
    <//>`}
  </section>`;
}

/* ───────── ผังบัญชี ───────── */
function CoAPage(c) {
  var s1 = useState(''), code = s1[0], setCode = s1[1];
  var s2 = useState(''), name = s2[0], setName = s2[1];
  var s3 = useState('5'), cat = s3[0], setCat = s3[1];
  var s4 = useState([]), errs = s4[0], setErrs = s4[1];
  function add(e) {
    e.preventDefault(); var er = [], cd = code.trim();
    if (!/^\d{3,5}$/.test(cd)) er.push('รหัสบัญชีต้องเป็นตัวเลข 3-5 หลัก');
    else if (c.d.accMap[cd]) er.push('รหัสบัญชี ' + cd + ' มีอยู่แล้ว');
    if (!name.trim()) er.push('กรุณาระบุชื่อบัญชี');
    if (er.length) { setErrs(er); return; }
    c.addAccount({ code: cd, name: name.trim(), cat: parseInt(cat, 10) });
    setCode(''); setName(''); setErrs([]);
  }
  return html`<section style=${{ '--mc': 'var(--m6)' }}>
    <div className="page-h"><h2>ผังบัญชี (Chart of Accounts)</h2><p>ผังบัญชีเริ่มต้นของกิจการค้าปลีก เพิ่มบัญชีใหม่ได้ บัญชีใหม่จะเลือกใช้ได้ในสมุดรายวันทันที</p></div>
    <div className="card"><div className="card-h"><h3>เพิ่มบัญชีใหม่</h3></div><div className="card-b"><form onSubmit=${add} noValidate>
      <div className="grid-f">
        <label className="fld"><span className="lbl">รหัสบัญชี</span><input className="inp" inputMode="numeric" placeholder="เช่น 515" value=${code} onChange=${function (e) { setCode(e.target.value); }} /></label>
        <label className="fld"><span className="lbl">ชื่อบัญชี</span><input className="inp" placeholder="เช่น ค่าขนส่งออก" value=${name} onChange=${function (e) { setName(e.target.value); }} /></label>
        <label className="fld"><span className="lbl">หมวด</span><select className="inp" value=${cat} onChange=${function (e) { setCat(e.target.value); }}>${[1, 2, 3, 4, 5].map(function (k) { return html`<option key=${k} value=${String(k)}>หมวด ${k} ${CATS[k]}</option>`; })}</select></label>
      </div><${Errs} errs=${errs} /><div className="actions"><button type="submit" className="btn primary"><${Icon} n="Plus" size=${16} />เพิ่มบัญชี</button></div></form></div></div>
    ${[1, 2, 3, 4, 5].map(function (k) {
    var items = c.data.accounts.filter(function (a) { return a.cat === k; });
    return html`<div className="card" key=${k}><div className="card-h"><h3>หมวด ${k} ${CATS[k]}</h3></div>
        <div className="tw"><table className="tbl" style=${{ minWidth: 380 }}><thead><tr><th>รหัส</th><th>ชื่อบัญชี</th><th className="r">รายการเคลื่อนไหว</th></tr></thead>
          <tbody>${items.map(function (a) { return html`<tr key=${a.code}><td><span className="code">${a.code}</span></td><td>${a.name}</td><td className="r num">${(c.d.ledAll[a.code] || []).length}</td></tr>`; })}</tbody></table></div></div>`;
  })}
  </section>`;
}

/* ───────── แอปหลัก ───────── */
function App() {
  var s0 = useState(initData), data = s0[0], setData = s0[1];
  var s1 = useState('journals'), menu = s1[0], setMenu = s1[1];
  var s2 = useState('PJ'), jt = s2[0], setJt = s2[1];
  var s3 = useState(null), ask = s3[0], setAsk = s3[1];
  var s4 = useState({ from: '', to: '' }), range = s4[0], setRange = s4[1];
  useEffect(function () { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { } }, [data]);
  var d = useMemo(function () { return derive(data, range); }, [data, range]);

  function addTxn(t) {
    var lines = t.lines.map(function (l) { return l.party ? Object.assign({}, l, { party: l.party.trim() }) : l; });
    t = Object.assign({}, t, { lines: lines });
    setData(function (s) {
      var ars = s.ars.slice(), aps = s.aps.slice();
      lines.forEach(function (l) {
        if (!l.party) return;
        if (l.acct === '111' && ars.indexOf(l.party) < 0) ars.push(l.party);
        if (l.acct === '201' && aps.indexOf(l.party) < 0) aps.push(l.party);
      });
      return Object.assign({}, s, { ars: ars, aps: aps, txns: s.txns.concat([t]) });
    });
    setRange(function (r) { return { from: r.from && t.date < r.from ? t.date : r.from, to: r.to && t.date > r.to ? t.date : r.to }; });
  }
  function delTxn(id) { setData(function (s) { return Object.assign({}, s, { txns: s.txns.filter(function (t) { return t.id !== id; }) }); }); }
  function addParty(kind, name) {
    setData(function (s) {
      var k = kind === 'AR' ? 'ars' : 'aps';
      if (s[k].indexOf(name) >= 0) return s;
      var o = {}; o[k] = s[k].concat([name]); return Object.assign({}, s, o);
    });
  }
  function addAccount(a) { setData(function (s) { return Object.assign({}, s, { accounts: s.accounts.concat([a]).sort(byCode) }); }); }
  function loadSample() { setData(function (s) { return Object.assign({}, s, { ars: union(s.ars, DEF_AR), aps: union(s.aps, DEF_AP), txns: sampleTxns() }); }); setRange({ from: '', to: '' }); setAsk(null); setMenu('log'); }
  function resetAll() { setData(function (s) { return Object.assign({}, s, { txns: [] }); }); setRange({ from: '', to: '' }); setAsk(null); }
  function askSample() { if (data.txns.length === 0) loadSample(); else setAsk('sample'); }
  function askReset() { if (data.txns.length === 0) return; setAsk('reset'); }

  var c = { range: range, setRange: setRange, rangeActive: !!(range.from || range.to), data: data, d: d, jt: jt, setJt: setJt, addTxn: addTxn, delTxn: delTxn, addParty: addParty, addAccount: addAccount };
  var tb = d.tb;
  var cash = (d.bal['101'] || 0) + (d.bal['102'] || 0);
  var MENUS = [['journals', 'BookOpen', '1', 'สมุดรายวัน 5 เล่ม', 'var(--m1)'], ['log', 'ClipboardList', '2', 'ทะเบียนรวมรายการค้า', 'var(--m2)'], ['gl', 'Library', '3', 'บัญชีแยกประเภท', 'var(--m3)'], ['sub', 'Users', '4', 'บัญชีย่อย & กระทบยอด', 'var(--m4)'], ['tb', 'Scale', '5', 'งบทดลอง', 'var(--m5)'], ['coa', 'ListChecks', '', 'ผังบัญชี', 'var(--m6)']];
  var page = menu === 'journals' ? html`<${JournalsPage} ...${c} />` : menu === 'log' ? html`<${LogPage} ...${c} />` : menu === 'gl' ? html`<${GLPage} ...${c} />` : menu === 'sub' ? html`<${SubPage} ...${c} />` : menu === 'tb' ? html`<${TBPage} ...${c} />` : html`<${CoAPage} ...${c} />`;

  return html`<div>
    <header className="top"><div className="wrap">
      <div className="brand"><div className="brand-ic"><${Logo} /></div>
        <div style=${{ minWidth: 0, flex: 1 }}><input className="biz-input" aria-label="ชื่อกิจการ (แก้ไขได้)" value=${data.biz} onChange=${function (e) { var v = e.target.value; setData(function (s) { return Object.assign({}, s, { biz: v }); }); }} />
          <small>ระบบบัญชีสมุดรายวันเฉพาะ · ร้านค้าปลีก ไม่มี VAT · สินค้าคงเหลือแบบสิ้นงวด · ข้อมูลทั้งหมดเป็นข้อมูลสมมติเพื่อการศึกษา</small></div></div>
      <div className="top-actions">
        ${!tb.has ? html`<span className="chip neutral">ยังไม่มีรายการ</span>` : tb.ok ? html`<span className="chip ok" style=${{ background: 'var(--ok-soft)' }}><${Icon} n="CheckCircle2" size=${15} />งบทดลองสมดุล</span>` : html`<span className="chip bad" style=${{ background: 'var(--bad-soft)' }}><${Icon} n="AlertTriangle" size=${15} />งบทดลองไม่สมดุล</span>`}
        <button type="button" className="btn sample" onClick=${askSample}>กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า</button>
        <button type="button" className="btn onnavy" onClick=${askReset}>ล้างข้อมูลทั้งหมด (Reset)</button>
      </div></div></header>
    ${ask ? html`<div className="confirm" role="alertdialog"><div className="wrap"><span>${ask === 'sample' ? 'การโหลดตัวอย่างจะแทนที่รายการค้าที่บันทึกไว้ทั้งหมดด้วยรายการตัวอย่าง 25 รายการ' : 'จะลบรายการค้าทั้งหมด (ผังบัญชีและรายชื่อลูกหนี้/เจ้าหนี้ยังคงอยู่) ย้อนกลับไม่ได้'}</span>
      <span className="flex gap-2"><button type="button" className="btn warn" onClick=${ask === 'sample' ? loadSample : resetAll}>ยืนยัน</button><button type="button" className="btn" onClick=${function () { setAsk(null); }}>ยกเลิก</button></span></div></div>` : null}
    <div className="navband"><div className="wrap"><nav className="menu" aria-label="เมนูหลัก">${MENUS.map(function (m) {
    return html`<button key=${m[0]} type="button" style=${{ '--mc': m[4] }} aria-current=${menu === m[0] ? 'page' : undefined} onClick=${function () { setMenu(m[0]); }}>${m[2] ? html`<span className="no">${m[2]}</span>` : null}<${Icon} n=${m[1]} size=${16} />${m[3]}</button>`;
  })}</nav></div></div>
    <main className="wrap main">
      <${FilterBar} range=${range} setRange=${setRange} inCount=${d.inCount} total=${d.sorted.length} />
      <div className="stats">
        <div className="stat"><div className="k">${c.rangeActive ? 'รายการค้าในช่วงที่เลือก' : 'รายการค้าทั้งหมด'}</div><div className="v num">${d.inCount} รายการ</div></div>
        <div className="stat"><div className="k">เงินสด + เงินฝากธนาคาร${range.to ? ' (ณ ' + fmtDate(range.to) + ')' : ''}</div><div className="v num">${fmt(cash)}</div></div>
        <div className="stat"><div className="k">ลูกหนี้การค้าคงเหลือ</div><div className="v num">${fmt(d.bal['111'] || 0)}</div></div>
        <div className="stat"><div className="k">เจ้าหนี้การค้าคงเหลือ</div><div className="v num">${fmt(-(d.bal['201'] || 0))}</div></div>
      </div>
      ${page}
    </main>
    <footer className="wrap foot">วันที่แสดงเป็นปี พ.ศ. · จำนวนเงินคำนวณเป็นสตางค์จำนวนเต็มเพื่อความแม่นยำ · ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น</footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>

</body></html>
